<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>rock, paper, scissors!</h1>
    <div class="button-area">
        <div class="rockArea">
            <img src="rock.avif" alt="Rock" class="rockImg" width="250" height="250">
            <button class="rockBtn">rock</button>
        </div>
        <div class="paperArea">
            <img src="paper.jpg" alt="Paper" class="paperImg" width="250" height="250">
            <button class="paperBtn">paper</button>
        </div>
        <div class="scissorsArea">
            <img src="scissors.avif" alt="Scissors" class="scissorsImg" width="250" height="250">
            <button class="scissorsBtn">scissors</button>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
